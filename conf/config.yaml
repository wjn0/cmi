# ============================================================================
# Shared base config for the representation-similarity experiments.
# ============================================================================
# Two experiments share this whole design (target sampling, hierarchy chains,
# null controls, fixed per-node fit/held-out splits) and differ only in their
# model set and a couple of fit sizes. Each is a member of the `experiment`
# config group (conf/experiment/*.yaml, `# @package _global_`):
#
#   uv run python -m repsim.run experiment=hierarchically_local_similarity
#   uv run python -m repsim.run experiment=dinov2_scale_similarity
#
# The similarity metric is its own `similarity` config group (linear | rbf_cka).
# Sweep both experiments AND both similarities in one launch (Hydra multirun) --
# each (experiment, similarity) pair is a separate run / MLflow run:
#
#   uv run python -m repsim.run -m \
#     experiment=hierarchically_local_similarity,dinov2_scale_similarity \
#     similarity=linear,rbf_cka
#
# The per-experiment scientific descriptions live in the experiment files.
# ============================================================================

defaults:
  - _self_
  - experiment: hierarchically_local_similarity
  - similarity: linear

seed: 0

# Targets ------------------------------------------------------------------
target_nodes: [feline]       # explicit starting nodes (WordNet lemma or synset)
n_random_targets: 75         # additional randomly sampled starting nodes
random_target_max_classes: 40 # max ImageNet leaf classes in a sampled target's subtree
# random_target_min_classes is experiment-specific (it depends on n_fit_samples).

# Hierarchy ----------------------------------------------------------------
max_ancestor_levels: 4       # ancestor (coarser) levels above each target
max_descendant_levels: 3     # descendant (finer) levels below each target
null_replicates: 4           # random size-matched null nodes per distinct breadth

# Sampling & data sufficiency ----------------------------------------------
# Held-out is a disjoint random split of each node's own images, so a node needs
# n_fit_samples + n_eval_samples images. n_fit_samples is experiment-specific
# (it scales with the largest model dim; see each experiment file).
per_class_limit: 1000        # images per class drawn from the pool
n_eval_samples: 250          # fixed held-out images per node for held-out R^2.

# Dataset ------------------------------------------------------------------
dataset:
  hf_id: benjamin-paine/imagenet-1k-256x256
  split: train               # single split; held-out is carved from each node

# Transforms & evaluation --------------------------------------------------
# The similarity metric is a config group (conf/similarity/*.yaml) so each metric
# is its OWN run -- sweep them as a Hydra axis instead of combining them in one
# results.csv (which collided in MLflow under one run name):
#   uv run python -m repsim.run -m similarity=linear,rbf_cka
#   - linear : affine least squares  min_{W,b} || f_i W + b - f_j ||_F,
#              R^2 = 1 - SS_res/SS_tot, in-sample and held-out.
#   - rbf_cka: nonlinear centred kernel alignment, Gaussian kernel (median
#              bandwidth), a non-fitted symmetric [0,1] similarity (needs whiten=false).
# `transforms` and `whiten` are set by the selected similarity group (defaults to
# linear above). whiten=true + linear == linear CKA (override manually). Add `rigid`
# to a transforms list for the PCA + similarity-Procrustes transform.

# Runtime ------------------------------------------------------------------
device: cuda                 # fails loudly if CUDA is unavailable
cache_dir: ./outputs/embeddings
# batch_size and num_workers are experiment-specific (model size / decode load).

# The per-node eval is embarrassingly parallel, so it fans out across CPU workers
# (joblib). -1 = the whole SLURM allocation (os.sched_getaffinity, not the node's
# total cores). NOTE: each worker holds its own RBF-CKA Gram matrices, which are
# O(n_fit_samples^2) -- on a memory-tight node with a large n_fit, lower n_jobs.
n_jobs: -1

# Experiment tracking ------------------------------------------------------
# Each run is logged to MLflow (params + summary metrics + results.csv/figures as
# artifacts) so results can be browsed in the UI instead of dug out of outputs/.
# Browse with:  uv run mlflow ui --backend-store-uri sqlite:///mlflow.db
mlflow:
  enabled: true
  tracking_uri: sqlite:///mlflow.db  # local single-file SQLite store at project root
                                     # (modern MLflow drops the bare ./mlruns file store).
                                     # Override with a remote server, or $MLFLOW_TRACKING_URI.
  experiment_name: repsim

hydra:
  job:
    chdir: false             # keep cwd at project root so cache_dir stays stable
