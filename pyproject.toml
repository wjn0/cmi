[project]
name = "repsim"
version = "0.1.0"
description = "Experiments in cross-model representation similarity, alignment, and identifiability."
authors = [
    { name = "Walter Nelson", email = "walter.nelson@ist.ac.at" }
]
requires-python = ">=3.10"
dependencies = [
    "beartype>=0.22.9",
    "datasets>=4.8.5",
    "hydra-core>=1.3.2",
    "jaxtyping>=0.3.7",
    "joblib>=1.5.3",
    "matplotlib>=3.10.9",
    "mlflow>=3.13.0",
    "nltk>=3.9.4",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pillow>=12.2.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.0",
    "seaborn>=0.13.2",
    "timm>=1.0.27",
    "torch>=2.12.0",
    "transformers>=5.9.0",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
